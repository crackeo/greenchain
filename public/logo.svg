<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- GreenChain mark: interlocked G (dark) + C (light) chain links -->
  <g transform="rotate(45 120 120)">
    <!-- dark link (G) -->
    <rect x="28" y="76" width="120" height="88" rx="44" fill="none" stroke="#1c7c3c" stroke-width="24"/>
    <!-- G crossbar -->
    <line x1="96" y1="120" x2="136" y2="120" stroke="#1c7c3c" stroke-width="24" stroke-linecap="round"/>
  </g>
  <g transform="rotate(45 120 120)">
    <!-- light link (C), open like a C -->
    <path d="M 176 76 a 44 44 0 0 1 0 88 h -40 a 44 44 0 0 1 -44 -44"
          fill="none" stroke="#7fc241" stroke-width="24" stroke-linecap="round"/>
  </g>
  <!-- leaf in the overlap -->
  <path d="M 120 106 q 14 10 0 30 q -14 -20 0 -30 z" fill="#ffffff"/>
</svg>
